[workspace]
members = ["crates/shogi-core", "crates/shogi-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
shogi-core = { path = "crates/shogi-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

